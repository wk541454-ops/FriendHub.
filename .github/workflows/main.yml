name: Build Android AAB from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unzip and Prepare Project
      run: |
        if [ -f "friendhub (1).zip" ]; then
          unzip -o "friendhub (1).zip" -d extracted
          # Move files if nested inside a folder
          if [ -d extracted/friendhub* ]; then
            cp -r extracted/friendhub*/* . || true
          else
            cp -r extracted/* . || true
          fi
        fi
        # Install gradle wrapper if missing
        gradle wrapper

    - name: Build Release Bundle (AAB)
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: |
          app/build/outputs/bundle/release/*.aab
          **/build/outputs/bundle/release/*.aab
