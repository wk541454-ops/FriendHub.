name: Build Android AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip File and Move Files
      run: |
        echo "Searching for zip file..."
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d temp_extracted
          
          # Find directory containing settings.gradle or build.gradle
          PROJ_DIR=$(find temp_extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1 | xargs dirname)
          
          if [ -n "$PROJ_DIR" ]; then
            echo "Moving files from $PROJ_DIR to root..."
            cp -r "$PROJ_DIR"/* .
          else
            echo "Moving all extracted files to root..."
            cp -r temp_extracted/* .
          fi
          rm -rf temp_extracted
        fi

    - name: Ensure Gradlew Executable
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Release AAB
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: |
          app/build/outputs/bundle/release/*.aab
          **/build/outputs/bundle/release/*.aab
