name: Build Android AAB from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip project file
      run: |
        if [ -f "friendhub (1).zip" ]; then
          unzip -o "friendhub (1).zip" -d extracted_app
          cp -r extracted_app/* . || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Build AAB
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew bundleRelease --continue
        else
          echo "Gradle wrapper not found, building with gradle..."
          gradle bundleRelease --continue
        fi

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: |
          **/build/outputs/bundle/release/*.aab
          app/build/outputs/bundle/release/*.aab
