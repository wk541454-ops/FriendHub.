name: Build Android AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Extract Zip File
      run: |
        echo "Extracting zip files..."
        for f in *.zip; do
          if [ -f "$f" ]; then
            echo "Unzipping $f"
            unzip -o "$f"
          fi
        done
        
        # Move files up if zip extracted into a subfolder
        if [ -d "friendhub" ]; then
          cp -rn friendhub/* . || true
        fi
        if [ -d "friendhub (1)" ]; then
          cp -rn "friendhub (1)"/* . || true
        fi

    - name: Ensure Gradlew Executable
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build AAB
      run: ./gradlew bundleRelease --stacktrace

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: |
          app/build/outputs/bundle/release/*.aab
          **/build/outputs/bundle/release/*.aab
